<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>DevPilot — Local AI Debugger & Control Center</title>
    <style>
        :root {
            --bg: #1e1e2e;
            --panel: #252538;
            --accent: #74c7ec;
            --text: #cdd6f4;
            --green: #a6e3a1;
            --red: #f38ba8;
        }
        body { margin: 0; font-family: 'Segoe UI', monospace; background: var(--bg); color: var(--text); }
        .header { background: var(--panel); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #313244; }
        select, button { background: #313244; color: var(--text); border: 1px solid #45475a; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
        .btn-green { background: #2e7d32; border-color: #388e3c; color: #fff; font-weight: bold; }
        .container { display: flex; height: calc(100vh - 65px); }
        .sidebar { width: 300px; background: var(--panel); padding: 20px; border-right: 1px solid #313244; }
        .main-chat { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { background: var(--panel); padding: 15px; border-radius: 6px; border-left: 4px solid var(--accent); }
        .diff-box { background: #11111b; padding: 10px; font-family: monospace; font-size: 13px; white-space: pre-wrap; margin-top: 10px; border-radius: 4px; }
        .diff-add { color: var(--green); }
        .diff-remove { color: var(--red); }
    </style>
</head>
<body>

<div class="header">
    <div style="font-weight: bold; font-size: 18px;"> DevPilot Control Center</div>
    <div>
        <label>Проект: </label>
        <select id="projectSelect" onchange="switchProject()"></select>
        <button onclick="triggerDebug()" class="btn-green">⚡ Проанализировать логи (Последние 10с)</button>
    </div>
</div>

<div class="container">
    <div class="sidebar">
        <h3>История / Точки отката</h3>
        <div id="historyList">Загрузка коммитов...</div>
    </div>
    <div class="main-chat" id="chat">
        <div class="msg">
            <b>DevPilot System:</b> Выберите локальный домен Open Server и нажмите «Проанализировать логи». Инструмент заберёт ошибки за последние 10 секунд и запросит диагноз у ИИ.
        </div>
    </div>
</div>

<script>
let currentProject = '';
let currentFixData = null;

async function init() {
    try {
        const res = await fetch('index.php?action=get_projects');
        const data = await res.json();
        const select = document.getElementById('projectSelect');
        if (data.projects && data.projects.length > 0) {
            select.innerHTML = data.projects.map(p => `<option value="${p}">${p}</option>`).join('');
            currentProject = data.projects[0];
        }
    } catch(e) {
        console.error("Ошибка при инициализации:", e);
    }
}

function switchProject() {
    currentProject = document.getElementById('projectSelect').value;
}

async function triggerDebug() {
    appendMsg('Система', 'Собираем логи и запрашиваем диагноз у ИИ...');
    
    try {
        const res = await fetch('index.php?action=analyze', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ project: currentProject })
        });
        
        const data = await res.json();

        if (data.status === 'ok') {
            const rawLogs = data.debug_raw_logs || [];
            const logPath = data.debug_log_path || '';
            const aiPrompt = data.debug_ai_prompt || '';

            let debugHtml = `<details style="background:#181825; padding:10px; border-radius:4px; margin-bottom:10px; border:1px solid #313244;">
                <summary style="cursor:pointer; color:#74c7ec; font-weight:bold;">🔍 Показать контекст, отправленный в ИИ (${rawLogs.length} стр.)</summary>
                <div style="font-size:11px; margin-top:8px;">
                    <b>Файл логов:</b> <code>${escapeHtml(logPath)}</code><br><br>
                    <b>Промпт (User Payload):</b>
                    <pre style="background:#11111b; color:#a6e3a1; padding:8px; overflow-x:auto; max-height:200px; white-space:pre-wrap;">${escapeHtml(aiPrompt)}</pre>
                </div>
            </details>`;
            
            appendMsg('Отладка Контекста', debugHtml);
            renderAIResponse(data.result);
        } else {
            appendMsg('Ошибка', data.message || 'Неизвестная ошибка сервера');
        }
    } catch(e) {
        appendMsg('Ошибка сети', e.message);
    }
}

function renderAIResponse(res) {
    if (!res) {
        appendMsg('DevPilot AI', 'Получен пустой ответ от модели');
        return;
    }
    currentFixData = res;
    
    const modelName = res.model ? `AI (${res.model})` : 'DevPilot AI';
    
    let html = '';
    if (res.diagnosis_short) {
        html += `<b>${escapeHtml(res.diagnosis_short)}</b><br>`;
    }
    html += `<p>${escapeHtml(res.diagnosis_long || 'Диагноз отсутствует')}</p>`;
    
    if (res.changes && res.changes.length > 0) {
        html += `<b>Предлагаемые правки (выберите файлы для применения):</b><br>`;
        res.changes.forEach((c, index) => {
            html += `<div class="diff-box" style="display: flex; align-items: center; gap: 10px;">
                <input type="checkbox" id="change_${index}" checked style="width: 18px; height: 18px; cursor: pointer;">
                <label for="change_${index}" style="cursor: pointer; flex: 1;">
                    📄 Файл: <b>${escapeHtml(c.file_path)}</b> <span style="color: #6c757d; font-size: 12px;">(полное обновление)</span>
                </label>
            </div>`;
        });
        html += `<br><button onclick="applyFix()" class="btn-green">✔ Применить выбранные правки (Сделать коммит и дамп БД)</button>`;
    }
    
    appendMsg(modelName, html);
}

async function applyFix() {
    if (!currentFixData || !currentFixData.changes) return;

    // Собираем только те изменения, у которых отмечен чекбокс
    const selectedChanges = [];
    currentFixData.changes.forEach((c, index) => {
        const checkbox = document.getElementById(`change_${index}`);
        if (checkbox && checkbox.checked) {
            selectedChanges.push(c);
        }
    });

    if (selectedChanges.length === 0) {
        alert('Не выбрано ни одного файла для применения!');
        return;
    }

    try {
        const res = await fetch('index.php?action=apply_fix', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                project: currentProject,
                changes: selectedChanges,
                diagnosis_short: (currentFixData && currentFixData.diagnosis_short) ? currentFixData.diagnosis_short : ''
            })
        });
        
        const data = await res.json();
        if (data.status === 'ok') {
            appendMsg('Система', `Правки успешно применены (${data.applied.join(', ')}). Создан коммит ${data.commit}.`);
        } else {
            appendMsg('Ошибка применения', data.message);
        }
    } catch(e) {
        appendMsg('Ошибка сети', e.message);
    }
}

function appendMsg(author, content) {
    const chat = document.getElementById('chat');
    const msgDiv = document.createElement('div');
    msgDiv.className = 'msg';
    msgDiv.innerHTML = `<b>${escapeHtml(author)}:</b><br>${content}`;
    chat.appendChild(msgDiv);
    chat.scrollTop = chat.scrollHeight;
}

function escapeHtml(text) {
    if (typeof text !== 'string') return '';
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

init();
</script>

</body>
</html>
